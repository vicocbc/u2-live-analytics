[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "u2lib"
version = "0.4.0"
description = "Pure-Python helpers for U2 Live Analytics (date parsing, song-name normalisation, matching, geo, data quality)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=u2lib --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["fabric", ".claude", "docs", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographic apostrophes are real input from setlist.fm song names.
allowed-confusables = ["‘", "’", "ʼ"]
